<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Vận hành — Canteen trường ABC</title><link rel="stylesheet" href="assets/app.css?v=rc411"></head><body>
<div class="ops-shell">
<header class="ops-header"><div class="ops-heading"><div class="ops-brand-line"><div class="ops-eyebrow">Canteen trường ABC</div><button class="btn theme-toggle" data-theme-toggle>☾ Tối</button></div><div class="ops-title">Vận hành</div><div class="ops-sub"><span class="network">● Đang kết nối</span> · Cập nhật theo thời gian thực</div></div><div class="ops-right"><div class="ops-stats"><div class="ops-stat new"><span id="workQty">0</span> suất cần làm</div><div class="ops-stat ready"><span id="readyCount">0</span> đơn chờ giao</div></div></div></header>
<div class="ops-mode-tabs"><button class="active" data-ops-tab="work">Cần làm</button><button data-ops-tab="handoff">Chờ giao</button><button data-ops-tab="summary">Tổng món</button></div>
<section class="ops-view" data-ops-view="work"><div class="kds-board"><section class="ops-panel kds-column" data-col="NEW"><div class="ops-panel-head"><span>Mới order</span><span class="ops-panel-count" data-count="NEW">0</span></div><div class="kds-list" data-list="NEW"></div></section><section class="ops-panel kds-column" data-col="PREPARING"><div class="ops-panel-head"><span>Đang làm</span><span class="ops-panel-count" data-count="PREPARING">0</span></div><div class="kds-list" data-list="PREPARING"></div></section></div></section>
<section class="ops-view" data-ops-view="handoff" hidden><section class="ops-panel counter-result"><div class="ops-panel-head"><span>Chờ giao</span><span class="ops-panel-count" data-count="READY">0</span></div><div class="ready-grid" data-list="READY"></div></section></section>
<section class="ops-view" data-ops-view="summary" hidden><section class="ops-panel ops-summary-panel"><div class="ops-panel-head"><span>Tổng món cần làm</span><span class="ops-panel-count" id="summaryTotal">0</span></div><div class="ops-summary-help">Chỉ tính Mới order + Đang làm. Món đã xong/chờ giao không còn nằm trong số cần xử lý.</div><div class="ops-summary-list" id="summaryList"></div></section></section>
</div><div id="k-toast" class="k-toast"></div>
<script src="assets/demo.js?v=rc411"></script><script>
(function(){var tab='work';function menuItem(s,id){return s.menu.find(function(m){return m.id===id})}function workItems(s,o){return o.items.filter(function(i){var m=menuItem(s,i.id);return (i.prepMode||(m&&m.prepMode))==='MADE_TO_ORDER'})}function esc(s){return CanteenDemo.esc(s)}function line(i){return '<div class="order-line"><span class="order-qty">'+i.qty+'</span><span class="order-x">×</span><div><div class="order-name">'+esc(i.name)+'</div></div></div>'}function card(s,o){var work=workItems(s,o),ready=o.items.filter(function(i){return work.indexOf(i)<0}),act=o.status==='NEW'?'<button class="action start" data-next="PREPARING">▶ Nhận làm</button>':'<button class="action done" data-next="READY">✓ Món đã xong</button>';return '<article class="order-card status-'+o.status.toLowerCase()+'" data-order="'+o.id+'"><div class="order-card-top"><div class="order-code">#'+esc(o.code)+'</div></div><div class="order-meta">'+esc(o.pickup||'Quầy chính')+'</div>'+work.map(line).join('')+(ready.length?'<div class="order-context">Kèm có sẵn: '+ready.map(function(i){return i.qty+'× '+esc(i.name)}).join(' · ')+'</div>':'')+(o.note?'<div class="order-note">⚠ Ghi chú: '+esc(o.note)+'</div>':'')+'<div class="order-action">'+act+'</div></article>'}function readyCard(o){return '<article class="order-card status-ready" data-order="'+o.id+'"><div class="order-card-top"><div class="order-code">#'+esc(o.code)+'</div><span class="badge badge-green">Chờ giao</span></div><div class="order-meta">'+esc(o.pickup||'Quầy chính')+'</div>'+o.items.map(line).join('')+(o.note?'<div class="order-note">⚠ Ghi chú: '+esc(o.note)+'</div>':'')+'<div class="order-action"><button class="action serve" data-serve>✓ Xác nhận đã giao</button></div></article>'}function summary(s){var map={};s.orders.filter(function(o){return o.status==='NEW'||o.status==='PREPARING'}).forEach(function(o){workItems(s,o).forEach(function(i){var r=map[i.name]||(map[i.name]={name:i.name,new:0,preparing:0,total:0});if(o.status==='NEW')r.new+=i.qty;else r.preparing+=i.qty;r.total+=i.qty})});return Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return b.total-a.total})}function render(){var s=CanteenDemo.state(),n=s.orders.filter(function(o){return o.status==='NEW'&&workItems(s,o).length}),p=s.orders.filter(function(o){return o.status==='PREPARING'&&workItems(s,o).length}),r=s.orders.filter(function(o){return o.status==='READY'}),sum=summary(s);document.querySelector('[data-list="NEW"]').innerHTML=n.map(function(o){return card(s,o)}).join('')||'<div class="empty">Chưa có đơn</div>';document.querySelector('[data-list="PREPARING"]').innerHTML=p.map(function(o){return card(s,o)}).join('')||'<div class="empty">Chưa có đơn</div>';document.querySelector('[data-list="READY"]').innerHTML=r.map(readyCard).join('')||'<div class="empty">Chưa có đơn chờ giao.</div>';document.querySelector('[data-count="NEW"]').textContent=n.length;document.querySelector('[data-count="PREPARING"]').textContent=p.length;document.querySelector('[data-count="READY"]').textContent=r.length;document.getElementById('readyCount').textContent=r.length;var total=sum.reduce(function(a,x){return a+x.total},0);document.getElementById('workQty').textContent=total;document.getElementById('summaryTotal').textContent=total;document.getElementById('summaryList').innerHTML=sum.map(function(x){return '<article class="ops-summary-row"><div class="ops-summary-name">'+esc(x.name)+'</div><div class="ops-summary-breakdown"><span><strong>'+x.new+'</strong> mới</span><span><strong>'+x.preparing+'</strong> đang làm</span></div><div class="ops-summary-total"><strong>'+x.total+'</strong><span>CẦN LÀM</span></div></article>'}).join('')||'<div class="empty">Hiện không có món cần làm.</div>'}document.querySelectorAll('[data-ops-tab]').forEach(function(b){b.onclick=function(){tab=b.dataset.opsTab;document.querySelectorAll('[data-ops-tab]').forEach(function(x){x.classList.toggle('active',x===b)});document.querySelectorAll('[data-ops-view]').forEach(function(v){v.hidden=v.dataset.opsView!==tab})}});document.addEventListener('click',function(e){var next=e.target.closest('[data-next]');if(next){var id=Number(next.closest('[data-order]').dataset.order),s=CanteenDemo.state(),o=s.orders.find(function(x){return x.id===id});if(o){o.status=next.dataset.next;o.statusAt=Date.now();CanteenDemo.audit(s,o.code+' → '+(o.status==='PREPARING'?'Đang làm':'Chờ giao'));CanteenDemo.save(s);render()}return}var serve=e.target.closest('[data-serve]');if(serve){var id2=Number(serve.closest('[data-order]').dataset.order),s2=CanteenDemo.state(),o2=s2.orders.find(function(x){return x.id===id2});if(o2&&o2.status==='READY'){o2.status='SERVED';o2.statusAt=Date.now();CanteenDemo.audit(s2,'Đã giao '+o2.code);CanteenDemo.save(s2);render()}}});render();window.addEventListener('canteen-demo-update',render)})();
</script></body></html>
