<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Vận hành — Canteen trường ABC</title><link rel="stylesheet" href="assets/app.css?v=rc411"></head><body>
<div class="ops-shell unified-ops"><header class="ops-header"><div class="ops-heading"><div class="ops-brand-line"><div class="ops-eyebrow">Canteen trường ABC</div><button class="btn theme-toggle" data-theme-toggle>☾ Tối</button></div><div class="ops-title">Vận hành</div><div class="ops-sub"><span class="network">● Đang kết nối</span> · Đơn đặt mới làm được xử lý tại đây</div></div><div class="ops-right"><div class="ops-stats"><div class="ops-stat new"><span id="needCount">0</span> suất cần làm</div><div class="ops-stat preparing"><span id="acceptedCount">0</span> đơn đã nhận</div><div class="ops-stat ready"><span id="readyCount">0</span> chờ giao</div></div></div></header>
<div class="ops-view-tabs"><button class="active" data-ops-view="work">Cần làm</button><button data-ops-view="ready">Chờ giao</button><button data-ops-view="summary">Tổng món</button></div>
<section class="ops-view" data-ops-panel="work"><div class="work-board"><section class="ops-panel work-lane"><div class="ops-panel-head"><span>Mới order</span><span class="ops-panel-count" id="newCount">0</span></div><div class="kds-list" id="newOrders"></div></section><section class="ops-panel work-lane"><div class="ops-panel-head"><span>Đã nhận</span><span class="ops-panel-count" id="prepCount">0</span></div><div class="kds-list" id="prepOrders"></div></section></div></section>
<section class="ops-view" data-ops-panel="ready" hidden><section class="pickup-search-section"><div class="pickup-search-heading">Tìm đơn</div><div class="pickup-search-body"><label class="pickup-search-label">Nhập mã nhận món</label><div class="pickup-search"><input id="codeSearch" class="input" placeholder="Ví dụ A173"><button id="searchBtn" class="btn btn-primary">Tìm đơn</button></div></div></section><div id="searchResultZone" class="search-result-zone" hidden></div><section class="ops-panel counter-result"><div class="ops-panel-head"><span>Chờ giao</span><span class="ops-panel-count" id="readyPanelCount">0</span></div><div class="ready-grid" id="readyGrid"></div></section></section>
<section class="ops-view" data-ops-panel="summary" hidden><div class="summary-intro"><div><div class="label">Tổng món cần làm</div><div class="h2">Chỉ tính Mới order + Đã nhận</div></div><div class="muted">Món đã xong không còn nằm trong số cần làm.</div></div><div id="summaryRows" class="production-summary-grid"></div></section>
</div><div id="opsToast" class="k-toast"></div>
<script src="assets/demo.js?v=rc411"></script><script>
(function(){var view='work';function esc(s){return CanteenDemo.esc(s)}function prod(o){return CanteenDemo.productionItems(o)}function itemLines(items,full){return items.map(function(i){return '<div class="order-line"><span class="order-qty">'+i.qty+'</span><span class="order-x">×</span><div><div class="order-name">'+esc(i.name)+(full&&i.prepMode==='READY_MADE'?' <span class="item-ready-made">Có sẵn</span>':'')+'</div></div></div>'}).join('')}function workCard(o){var isNew=o.status==='NEW';return '<article class="order-card status-'+(isNew?'new':'preparing')+'"><div class="order-card-top"><div class="order-code">#'+o.code+'</div><span class="badge '+(isNew?'badge-blue':'badge-orange')+'">'+(isNew?'Mới order':'Đã nhận')+'</span></div>'+itemLines(prod(o),false)+(o.note?'<div class="order-note"><strong>Ghi chú:</strong> '+esc(o.note)+'</div>':'')+'<div class="order-action"><button class="action '+(isNew?'start':'ready')+'" data-move="'+(isNew?'PREPARING':'READY')+'" data-id="'+o.id+'">'+(isNew?'BẮT ĐẦU LÀM':'MÓN ĐÃ XONG')+'</button></div></article>'}function readyCard(o){return '<article class="order-card status-ready"><div class="order-card-top"><div class="order-code">#'+o.code+'</div><span class="badge badge-green">Chờ giao</span></div>'+itemLines(o.items,true)+(o.note?'<div class="order-note"><strong>Ghi chú:</strong> '+esc(o.note)+'</div>':'')+'<div class="order-action"><button class="action serve" data-serve="'+o.id+'">XÁC NHẬN ĐÃ GIAO</button></div></article>'}function render(){var s=CanteenDemo.state(),n=s.orders.filter(function(o){return o.status==='NEW'}),p=s.orders.filter(function(o){return o.status==='PREPARING'}),r=s.orders.filter(function(o){return o.status==='READY'}),sum=CanteenDemo.summary(s);document.getElementById('newOrders').innerHTML=n.length?n.map(workCard).join(''):'<div class="counter-empty">Không có món mới.</div>';document.getElementById('prepOrders').innerHTML=p.length?p.map(workCard).join(''):'<div class="counter-empty">Không có món đã nhận.</div>';document.getElementById('readyGrid').innerHTML=r.length?r.map(readyCard).join(''):'<div class="counter-empty">Chưa có đơn chờ giao.</div>';document.getElementById('newCount').textContent=n.length;document.getElementById('prepCount').textContent=p.length;document.getElementById('readyPanelCount').textContent=r.length;document.getElementById('readyCount').textContent=r.length;document.getElementById('acceptedCount').textContent=p.length;document.getElementById('needCount').textContent=sum.reduce(function(a,x){return a+x.needToMake},0);document.getElementById('summaryRows').innerHTML=sum.length?sum.map(function(x){return '<article class="production-summary-card"><div class="summary-name">'+esc(x.name)+'</div><div class="summary-need"><strong>'+x.needToMake+'</strong><span>CẦN LÀM</span></div><div class="summary-breakdown"><span><strong>'+x.new+'</strong> mới order</span><span><strong>'+x.accepted+'</strong> đã nhận</span></div></article>'}).join(''):'<div class="empty">Hiện không có món nào cần làm.</div>';search(false)}function setView(v){view=v;document.querySelectorAll('[data-ops-view]').forEach(function(b){b.classList.toggle('active',b.dataset.opsView===v)});document.querySelectorAll('[data-ops-panel]').forEach(function(p){p.hidden=p.dataset.opsPanel!==v})}function search(force){var z=document.getElementById('searchResultZone'),code=document.getElementById('codeSearch').value.trim().toUpperCase();if(!code&&!force){z.hidden=true;z.innerHTML='';return}var o=CanteenDemo.state().orders.find(function(x){return x.status==='READY'&&x.code===code});z.hidden=false;z.innerHTML=o?'<div class="search-result-title">Kết quả tìm kiếm</div><div class="search-result">'+readyCard(o)+'</div>':'<div class="alert alert-danger">Không tìm thấy đơn <strong>'+esc(code)+'</strong> trong hàng chờ giao.</div>'}document.addEventListener('click',function(e){var t=e.target.closest('[data-ops-view]');if(t){setView(t.dataset.opsView);return}var m=e.target.closest('[data-move]');if(m){var s=CanteenDemo.state(),o=s.orders.find(function(x){return x.id===Number(m.dataset.id)});if(!o)return;if(m.dataset.move==='PREPARING')prod(o).forEach(function(i){if(i.workflowStatus==='WAITING')i.workflowStatus='PREPARING'});else prod(o).forEach(function(i){if(i.workflowStatus==='WAITING'||i.workflowStatus==='PREPARING')i.workflowStatus='READY'});CanteenDemo.syncOrderStatus(o);CanteenDemo.audit(s,(m.dataset.move==='PREPARING'?'Nhận làm ':'Hoàn tất ')+o.code);CanteenDemo.save(s);render();return}var sv=e.target.closest('[data-serve]');if(sv){var s2=CanteenDemo.state(),o2=s2.orders.find(function(x){return x.id===Number(sv.dataset.serve)});if(!o2||o2.status!=='READY')return;o2.status='SERVED';prod(o2).forEach(function(i){if(i.workflowStatus==='READY')i.workflowStatus='SERVED'});CanteenDemo.audit(s2,'Đã giao '+o2.code);CanteenDemo.save(s2);render();return}});document.getElementById('searchBtn').onclick=function(){search(true)};window.addEventListener('canteen-demo-update',render);render();})();
</script></body></html>
