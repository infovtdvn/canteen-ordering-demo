<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Đặt món — Canteen trường ABC</title><link rel="stylesheet" href="assets/app.css?v=rc411"></head><body>
<div class="customer-body"><header class="customer-header"><div class="customer-head"><div class="customer-head-copy"><div class="label">Canteen trường ABC</div><div class="h2" style="margin-top:3px">Menu hôm nay</div></div><div class="customer-head-controls"><button class="btn theme-toggle" data-theme-toggle>☾ Tối</button><span id="orderingBadge" class="badge badge-success">Đang nhận đơn</span></div></div></header>
<main class="customer-wrap"><div class="card between"><div><div class="label">Nhận món tại</div><div class="h3" style="margin-top:4px">Quầy chính</div></div><div style="min-width:150px"><select><option>Lấy ngay</option></select></div></div><div id="categoryTabs" class="tabs"></div><div id="foodList" class="stack"></div>
<section id="cartPanel" class="card cart-panel"><div class="label">Đơn của bạn</div><div class="h2" style="margin-top:4px">Giỏ hàng</div><div id="cartLines" class="stack" style="margin-top:12px"></div><div class="form-group" style="margin-top:14px"><label>Ghi chú cho bếp</label><textarea id="customerNote" rows="2" placeholder="Ví dụ: không hành, ít cay..."></textarea></div><div class="between" style="margin-top:14px"><strong>Tổng cộng</strong><strong id="cartTotal" style="font-size:22px">0đ</strong></div><button id="placeOrder" class="btn btn-primary" style="width:100%;margin-top:12px;min-height:50px">ĐẶT MÓN</button></section><div id="orderResult" style="display:none"></div></main>
<div class="cart-bar"><div class="cart-bar-inner"><div><strong><span id="cartCount">0</span> món</strong><div id="cartBarTotal" class="muted" style="font-size:13px">0đ</div></div><button id="toggleCart" class="btn btn-primary">Xem giỏ hàng</button></div></div></div>
<script src="assets/demo.js?v=rc411"></script><script>
(function(){var cart={},activeCat='all';function st(){return CanteenDemo.state()}function todayItems(){return st().menu.filter(function(m){return m.today})}function renderMenu(){var s=st(),items=s.menu.filter(function(m){return m.today}),cats=s.categories.filter(function(c){return items.some(function(m){return m.cat===c})}),html='';document.getElementById('categoryTabs').innerHTML='<button class="tab '+(activeCat==='all'?'active':'')+'" data-cat="all">Tất cả</button>'+cats.map(function(c){return '<button class="tab '+(activeCat===c?'active':'')+'" data-cat="'+CanteenDemo.esc(c)+'">'+CanteenDemo.esc(c)+'</button>'}).join('');items.forEach(function(m){var stockOut=m.stock<=0,sold=!m.todayAvailable||stockOut,badge=!m.todayAvailable?'<span class="badge badge-danger">Tạm hết</span>':stockOut?'<span class="badge badge-danger">Hết món</span>':(m.stock<=m.threshold?'<span class="badge badge-warn">Còn '+m.stock+' suất</span>':'<span class="badge">Còn món</span>');html+='<article class="card food '+(sold?'sold':'')+'" data-food data-cat="'+CanteenDemo.esc(m.cat)+'"><div class="thumb"><img src="'+CanteenDemo.imageSrc(m)+'" alt="'+CanteenDemo.esc(m.name)+'"></div><div class="food-main"><div class="h3 food-name">'+CanteenDemo.esc(m.name)+'</div><div class="muted" style="font-size:14px;margin-top:4px">'+CanteenDemo.esc(m.desc)+'</div><strong class="price">'+CanteenDemo.money(m.price)+'</strong><div style="margin-top:6px">'+badge+'</div></div>'+(sold?'<button class="btn" disabled>'+(!m.todayAvailable?'Tạm hết':'Hết')+'</button>':'<div class="qty"><button data-minus="'+m.id+'" aria-label="Giảm '+CanteenDemo.esc(m.name)+'">−</button><strong>'+(cart[m.id]||0)+'</strong><button data-plus="'+m.id+'" aria-label="Tăng '+CanteenDemo.esc(m.name)+'">+</button></div>')+'</article>'});document.getElementById('foodList').innerHTML=html||'<div class="card empty">Hôm nay chưa có món được mở bán.</div>';applyCat();drawCart();var b=document.getElementById('orderingBadge');b.textContent=s.ordering?'Đang nhận đơn':'Tạm ngưng nhận đơn';b.className='badge '+(s.ordering?'badge-success':'badge-danger')}
function applyCat(){document.querySelectorAll('[data-food]').forEach(function(el){el.style.display=(activeCat==='all'||el.getAttribute('data-cat')===activeCat)?'':'none'})}function drawCart(){var s=st(),ids=Object.keys(cart),total=0,count=0,html='';ids.forEach(function(id){var q=cart[id],m=s.menu.find(function(x){return x.id===Number(id)});if(!m||q<=0)return;count+=q;total+=q*m.price;html+='<div class="cart-line"><span><strong>'+q+' ×</strong> '+CanteenDemo.esc(m.name)+'</span><strong>'+CanteenDemo.money(q*m.price)+'</strong></div>'});document.getElementById('cartLines').innerHTML=html||'<div class="muted">Chưa có món.</div>';document.getElementById('cartCount').textContent=count;document.getElementById('cartTotal').textContent=CanteenDemo.money(total);document.getElementById('cartBarTotal').textContent=CanteenDemo.money(total)}
document.addEventListener('click',function(e){var p=e.target.closest('[data-plus]'),m=e.target.closest('[data-minus]'),t=e.target.closest('.tab[data-cat]');if(p||m){var control=p||m,id=Number(control.getAttribute(p?'data-plus':'data-minus')),mi=st().menu.find(function(x){return x.id===id});if(!mi||!mi.today||!mi.todayAvailable||mi.stock<=0)return;var n=(cart[id]||0)+(p?1:-1);n=Math.max(0,Math.min(mi.stock,20,n));if(n)cart[id]=n;else delete cart[id];var qty=control.closest('[data-food]').querySelector('.qty strong');if(qty)qty.textContent=n;drawCart();return}if(t){activeCat=t.getAttribute('data-cat');document.querySelectorAll('.tab[data-cat]').forEach(function(x){x.classList.remove('active')});t.classList.add('active');applyCat()}});document.getElementById('toggleCart').onclick=function(){document.getElementById('cartPanel').classList.toggle('open')};document.getElementById('placeOrder').onclick=function(){var s=st(),ids=Object.keys(cart);if(!ids.length)return alert('Vui lòng chọn ít nhất một món.');if(!s.ordering)return alert('Canteen đang tạm ngưng nhận đơn.');var items=[];for(var i=0;i<ids.length;i++){var id=Number(ids[i]),q=cart[id],mi=s.menu.find(function(x){return x.id===id});if(!mi||!mi.today||!mi.todayAvailable)return alert((mi?mi.name:'Món')+' không còn bán trong hôm nay.');if(mi.stock<q)return alert(mi.name+' không đủ số lượng.');mi.stock-=q;items.push({id:id,name:mi.name,qty:q,price:mi.price,prepMode:mi.prepMode,workflowStatus:mi.prepMode==='MADE_TO_ORDER'?'WAITING':'NOT_REQUIRED'})}s.next++;var code='A'+s.next;var hasProduction=items.some(function(x){return x.prepMode==='MADE_TO_ORDER'});s.orders.unshift({id:s.next,code:code,status:hasProduction?'NEW':'READY',created:Date.now(),statusAt:Date.now(),pickup:'Quầy chính • Lấy ngay',note:document.getElementById('customerNote').value.trim(),items:items});CanteenDemo.audit(s,'Khách tạo đơn '+code);CanteenDemo.save(s);cart={};renderMenu();document.getElementById('cartPanel').classList.remove('open');var r=document.getElementById('orderResult');r.style.display='block';r.innerHTML='<div class="card order-success"><span class="badge badge-success">Đã nhận đơn</span><div class="label" style="margin-top:16px">Mã nhận món</div><div class="order-code-big">'+code+'</div><div class="muted">Quầy chính • Lấy ngay</div><div class="muted" style="margin-top:14px">Vui lòng giữ mã này để nhận món tại Quầy chính.</div></div>';r.scrollIntoView({behavior:'smooth',block:'center'})};renderMenu()})();
</script></body></html>
